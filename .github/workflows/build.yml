---
name: Build container image
on:
  push:
    branches:
      - main
      - master
      - template
  schedule:
    - cron: '17 */1 * * *'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        version: [rawhide, 44, 45]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Get current base image digest
        id: base-digest
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "safe=${DIGEST//:/_}" >> "$GITHUB_OUTPUT"

      - name: Restore last known base image digest
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
          restore-keys: |
            base-digest-${{ matrix.version }}-

      - name: Check if base image changed
        id: check
        run: |
          if [ -f /tmp/base-digest/digest ] && [ "$(cat /tmp/base-digest/digest)" = "${{ steps.base-digest.outputs.digest }}" ]; then
            echo "Base image unchanged, skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Image
        id: build-image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign container image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Record base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          mkdir -p /tmp/base-digest
          echo "${{ steps.base-digest.outputs.digest }}" > /tmp/base-digest/digest

      - name: Save base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
