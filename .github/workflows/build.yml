---
name: Build container image
on:
  push:
    branches:
      - main
      - master
      - template
  pull_request:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        version: [44, 45]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image registry
        id: registry
        run: |
          # This workflow runs both on GitHub and on a local Gitea instance.
          # github.server_url is https://github.com on GitHub; on Gitea the
          # github context is mirrored, so it is the instance URL there.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            host="ghcr.io"
          else
            host="${{ github.server_url }}"
            host="${host#http://}"
            host="${host#https://}"
            host="${host%%/*}"
          fi
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image_registry=${host}/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # Only needed for pushing; PR builds never push, and fork PRs have no secrets
        if: github.event_name != 'pull_request' && github.server_url == 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to local container registry
        # Same gate as the GHCR login, but for runs on the local Gitea
        # instance. Uses a PAT (REGISTRY_TOKEN): Gitea's built-in job
        # token has no package scope and cannot log in to the registry.
        if: github.event_name != 'pull_request' && github.server_url != 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@v7

      - name: Install just
        run: |
          set -euo pipefail
          tag="$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest | sed 's|.*/||')"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${tag}/just-${tag}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install podman (Gitea only)
        # GitHub's runners preinstall podman; Gitea's default runner image
        # (ubuntu-latest) does not ship it — it has the Docker CLI, git and
        # jq, but no podman. The -full image ships podman but is ~75 GB on
        # disk, so on Gitea we install just what's needed instead. The
        # explicit packages after podman are its rootless helpers on
        # Ubuntu 24.04 (fuse-overlayfs for storage, uidmap's
        # newuidmap/newgidmap for user namespaces, slirp4netns for
        # rootless networking); apt also pulls podman's own dependencies
        # (crun/conmon/netavark) automatically.
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y podman fuse-overlayfs uidmap slirp4netns
          podman --version

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          echo "DEFAULT_TAG=${{ matrix.version }}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          IMAGE_REGISTRY="${{ steps.registry.outputs.image_registry }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Get current base image digest
        id: base-digest
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "safe=${DIGEST//:/_}" >> "$GITHUB_OUTPUT"

      - name: Restore last known base image digest
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
          restore-keys: |
            base-digest-${{ matrix.version }}-

      - name: Check if base image changed
        id: check
        run: |
          if [ -f /tmp/base-digest/digest ] && [ "$(cat /tmp/base-digest/digest)" = "${{ steps.base-digest.outputs.digest }}" ]; then
            echo "Base image unchanged, skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Image
        id: build-image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # - name: Rechunk with rpm-ostree
      #   id: rechunk
      #   if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
      #   run: |
      #     just ostree-rechunk \
      #       ${IMAGE_NAME} \
      #       ${DEFAULT_TAG}

      - name: Rechunk with Chunkah
        id: rechunk
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push image to registry
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        # Do not use --compression-format=zstd:chunked because that changes the digest
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign container image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Record base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          mkdir -p /tmp/base-digest
          echo "${{ steps.base-digest.outputs.digest }}" > /tmp/base-digest/digest

      - name: Save base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
