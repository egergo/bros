---
name: Build container image
on:
  push:
    branches:
      - main
      - master
      - template
  pull_request:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        version: [44, 45]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image registry
        id: registry
        run: |
          # This workflow runs both on GitHub and on a local Gitea instance.
          # github.server_url is https://github.com on GitHub; on Gitea the
          # github context is mirrored, so it is the instance URL there.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            host="ghcr.io"
          else
            host="${{ github.server_url }}"
            host="${host#http://}"
            host="${host#https://}"
            host="${host%%/*}"
          fi
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image_registry=${host}/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # Only needed for pushing; PR builds never push, and fork PRs have no secrets
        if: github.event_name != 'pull_request' && github.server_url == 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to local container registry
        # Same gate as the GHCR login, but for runs on the local Gitea
        # instance. Uses a PAT (REGISTRY_TOKEN): Gitea's built-in job
        # token has no package scope and cannot log in to the registry.
        if: github.event_name != 'pull_request' && github.server_url != 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@v7

      - name: Install just
        run: |
          set -euo pipefail
          tag="$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest | sed 's|.*/||')"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${tag}/just-${tag}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install podman (Gitea only)
        # GitHub's runners preinstall podman; Gitea's default runner image
        # (ubuntu-latest) does not ship it — it has the Docker CLI, git and
        # jq, but no podman. The -full image ships podman but is ~75 GB on
        # disk, so on Gitea we install just what's needed instead. The
        # explicit packages after podman are its rootless helpers on
        # Ubuntu 24.04 (fuse-overlayfs for storage, uidmap's
        # newuidmap/newgidmap for user namespaces, slirp4netns for
        # rootless networking); apt also pulls podman's own dependencies
        # (crun/conmon/netavark) automatically.
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y podman fuse-overlayfs uidmap slirp4netns
          podman --version

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          echo "DEFAULT_TAG=${{ matrix.version }}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          IMAGE_REGISTRY="${{ steps.registry.outputs.image_registry }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Get current base image digest
        id: base-digest
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "safe=${DIGEST//:/_}" >> "$GITHUB_OUTPUT"

      - name: Restore last known base image digest
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
          restore-keys: |
            base-digest-${{ matrix.version }}-

      - name: Check if base image changed
        id: check
        run: |
          if [ -f /tmp/base-digest/digest ] && [ "$(cat /tmp/base-digest/digest)" = "${{ steps.base-digest.outputs.digest }}" ]; then
            echo "Base image unchanged, skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Image
        id: build-image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          BASE_IMAGE: quay.io/fedora-ostree-desktops/kinoite:${{ matrix.version }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # - name: Rechunk with rpm-ostree
      #   id: rechunk
      #   if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
      #   run: |
      #     just ostree-rechunk \
      #       ${IMAGE_NAME} \
      #       ${DEFAULT_TAG}

      - name: Rechunk with Chunkah
        id: rechunk
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Install boot test tooling (bcvk + libvirt)
        # GitHub-hosted runners only: they provide /dev/kvm and can run the
        # libvirt stack. The Gitea runner is an Incus VM without a verified
        # KVM/libvirt setup, so the boot test is skipped there.
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.server_url == 'https://github.com'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # /dev/kvm exists on GitHub's ubuntu runners but is group-restricted;
          # open it up the way bootc's own CI setup does.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils virtiofsd libvirt-daemon-system libvirt-clients openssh-client ovmf
          sudo systemctl enable --now libvirtd
          # sg (used by the boot test step) checks membership in /etc/group
          # at exec time; without this it demands the group password and
          # fails on the non-tty runner shell.
          sudo usermod -a -G libvirt "$USER"
          # bcvk writes its base disk directly into the default storage
          # pool directory, which libvirt ships root-only; let the libvirt
          # group write there.
          sudo chown root:libvirt /var/lib/libvirt/images
          sudo chmod 2775 /var/lib/libvirt/images
          # bcvk prebuilt binary, fetched the way its installation docs
          # describe: an OCI artifact pulled with oras.
          oras_tag="$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/oras-project/oras/releases/latest | sed 's|.*/||')"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/${oras_tag}/oras_${oras_tag#v}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin oras
          mkdir -p /tmp/bcvk && cd /tmp/bcvk
          oras pull ghcr.io/bootc-dev/bcvk-binary:x86_64-latest
          tar -xzf bcvk-x86_64-unknown-linux-gnu.tar.gz
          sudo install -m 755 bcvk-x86_64-unknown-linux-gnu /usr/local/bin/bcvk
          ls -l /usr/local/bin/bcvk

      - name: Boot test the built image
        # Install the just-built image to a real disk with bcvk (which wraps
        # `bootc install to-disk`) and boot it under libvirt. Fails the build
        # if the image does not reach a running system over SSH. This is the
        # check that would have caught PR #22: the container build was green
        # while the image could not get past its initramfs. Runs before the
        # push steps, so an unbootable image is never published.
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.server_url == 'https://github.com'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          VM=bros-boot-test
          # The runner user is not in the libvirt group in this shell (group
          # changes need a new login), so run bcvk through sg.
          LIBVIRT_BCVK() { sg libvirt -c "bcvk $*"; }
          cleanup() { LIBVIRT_BCVK "libvirt rm ${VM}" || true; }
          trap cleanup EXIT
          LIBVIRT_BCVK "libvirt run --name ${VM} --memory 8192 --cpus 4 --disk-size 64G localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          # Wait for SSH to come up at all (up to ~10 minutes).
          up=0
          for i in $(seq 1 60); do
            if LIBVIRT_BCVK "libvirt ssh ${VM} 'true'" 2>/dev/null; then up=1; break; fi
            sleep 10
          done
          if [ "${up}" != 1 ]; then
            echo "VM did not answer SSH within 10 minutes"
            exit 1
          fi
          # Then wait for systemd to settle into running or degraded
          # (degraded is acceptable for a desktop image in a VM; emergency
          # or maintenance states are what this test exists to catch).
          state=""
          for i in $(seq 1 30); do
            state="$(LIBVIRT_BCVK "libvirt ssh ${VM} 'systemctl is-system-running'" || true)"
            case "${state}" in
              running|degraded) break ;;
            esac
            sleep 10
          done
          echo "is-system-running: ${state}"
          case "${state}" in
            running|degraded) ;;
            *) echo "VM did not reach a running state"; exit 1 ;;
          esac
          # Prove the booted deployment is the image this job built.
          LIBVIRT_BCVK "libvirt ssh ${VM} 'bootc status'" | tee /tmp/bootc-status.txt
          grep -q "${IMAGE_NAME}" /tmp/bootc-status.txt

      - name: Push image to registry
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        # Do not use --compression-format=zstd:chunked because that changes the digest
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign container image
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Record base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          mkdir -p /tmp/base-digest
          echo "${{ steps.base-digest.outputs.digest }}" > /tmp/base-digest/digest

      - name: Save base image digest
        if: success() && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /tmp/base-digest
          key: base-digest-${{ matrix.version }}-${{ steps.base-digest.outputs.safe }}
