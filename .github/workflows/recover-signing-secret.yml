name: Recover signing secret

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/recover-signing-secret.yml

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt SIGNING_SECRET to the owner's age key
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          AGE_RECIPIENT: "age1fp9lc4n2xaf20lcna96fdngvl9d8w9vtw8xs63l9y69zmnx3aq0sap4kec"
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_SECRET}" ]; then
            echo "::error::SIGNING_SECRET is empty or missing"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          printf '%s' "${SIGNING_SECRET}" > cosign.key
          age -r "${AGE_RECIPIENT}" -o cosign.key.age cosign.key
          rm -f cosign.key
      - name: Upload encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: recovered-signing-key
          path: cosign.key.age
          retention-days: 1
