# Administrator customizations go in this file
#
# BrOS: use Fedora's spinner theme for the graphical boot splash and
# the LUKS passphrase prompt instead of the plymouth distribution
# default (Theme=bgrt in /usr/share/plymouth/plymouthd.defaults,
# verified in the plymouth RPM payloads of both build legs:
# 24.004.60-24.fc44 and 26.134.222-6.fc45). bgrt frames the prompt
# with the hardware vendor's firmware logo; spinner is the plain
# Fedora face. The prompt's wording comes from systemd's
# ask-password machinery and is the same under every theme.
#
# This file is copied to /etc by build.sh before the kernel install
# step that generates the initramfs, so the theme is picked up there.
# On an installed machine, a locally modified /etc/plymouth/plymouthd.conf
# (e.g. from plymouth-set-default-theme) shadows this image default.
[Daemon]
Theme=spinner
