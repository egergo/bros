# BrOS: this file is the image's default /etc/rpm-ostreed.conf.
# The one change from the Fedora default is the policy under
# [Daemon]: automatic updates are staged, never auto-applied.
# A locally edited /etc/rpm-ostreed.conf still wins over this
# default via the ostree /etc merge.
# Entries in this file show the compile time defaults.
# You can change settings by editing this file.
# For option meanings, see rpm-ostreed.conf(5).

[Daemon]
AutomaticUpdatePolicy=stage
#IdleExitTimeout=60
#LockLayering=false
#Recommends=true
